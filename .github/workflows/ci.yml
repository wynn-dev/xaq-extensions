name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # build-index.mjs --check reads each entry's pinned commit.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          # xaq's oldest supported Node (its engines field).
          node-version: "22.13"
      - name: Integrity test vectors (shared with xaq)
        run: node scripts/integrity.mjs --vectors test/fixtures/extension-integrity
      - name: Validate manifests
        run: node scripts/validate.mjs
      - name: Check index.json pins
        run: node scripts/build-index.mjs --check
      - name: Script tests
        run: node --test test/*.test.mjs
      - name: Extension tests
        # Each extension's own tests, if it has any: extensions/<name>/test/*.test.mjs, run with node --test.
        run: |
          shopt -s nullglob
          status=0
          for dir in extensions/*/; do
            tests=("$dir"test/*.test.mjs)
            if [ ${#tests[@]} -eq 0 ]; then
              continue
            fi
            echo "::group::${dir}"
            node --test "${tests[@]}" || status=1
            echo "::endgroup::"
          done
          exit "$status"
